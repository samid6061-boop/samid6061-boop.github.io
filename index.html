// Underline draw on scroll into view
const u = document.getElementById('underline1');
const io = new IntersectionObserver((entries)=>{
entries.forEach(e=>{ if(e.isIntersecting){ u.classList.add('in-view'); io.disconnect(); } });
},{threshold:.6});
io.observe(u);
// Before/after demo toggle
const demoCard = document.getElementById('demoCard');
const demoSwitch = document.getElementById('demoSwitch');
const demoLabel = document.getElementById('demoLabel');
demoSwitch.addEventListener('click', ()=>{
const pressed = demoSwitch.getAttribute('aria-pressed') === 'true';
demoSwitch.setAttribute('aria-pressed', String(!pressed));
demoCard.classList.toggle('after-mode', !pressed);
demoLabel.textContent = !pressed ? 'Showing the edit' : 'Show the edit';
});
